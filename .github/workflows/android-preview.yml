name: Android preview APK

on:
  push:
    branches: [feat/wayfare-android-app]
    paths:
      - .github/workflows/android-preview.yml
      - mobile/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_SITE_URL: ${{ vars.EXPO_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: sdkmanager --install 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006'
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Check configuration
        run: test -n "$EXPO_PUBLIC_SUPABASE_URL" && test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build preview APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wayfare-preview-unsigned-for-resigning
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1
